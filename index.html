<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mリーグ ドラフト会議</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<header class="app-header">
  <h1>Mリーグ ドラフト会議</h1>
  <div id="identity-bar" class="identity-bar">
    <span>あなた: </span>
    <select id="identity-select">
      <option value="">選択してください</option>
    </select>
  </div>
</header>

<main>

<section class="draft-block" id="player-draft-block">
  <div class="draft-heading-row">
    <h2 class="draft-heading">選手ドラフト</h2>
    <div class="board-side">
      <button id="player-reveal-btn" class="btn btn-primary" disabled>指名結果発表</button>
      <button id="player-lottery-btn" class="btn btn-danger" hidden>抽選を行う</button>
      <button id="player-next-round-btn" class="btn btn-primary" hidden>次の巡へ進む</button>
    </div>
  </div>
  <div id="player-status-banner" class="status-banner" hidden></div>

  <p class="scroll-hint">← 横にスクロールできます →</p>
  <div class="board-wrap">
    <div class="board-scroll">
      <table id="player-board-table" class="board-table">
        <colgroup>
          <col style="width:160px">
          <col><col><col><col><col>
        </colgroup>
        <thead>
          <tr id="player-board-header-row">
            <th></th>
          </tr>
        </thead>
        <tbody id="player-board-body"></tbody>
      </table>
    </div>
  </div>

  <div id="player-pick-panel" class="pick-panel" hidden>
    <h3>あなたの指名選手を選んでください（第<span id="player-pick-round-num"></span>巡）</h3>
    <select id="player-item-select"></select>
    <button id="player-pick-btn" class="btn btn-primary">指名する</button>
  </div>

  <div id="player-wait-panel" class="wait-panel" hidden>
    <p id="player-wait-message"></p>
  </div>

  <div id="player-lottery-panel" class="lottery-panel" hidden>
    <h3>抽選中...</h3>
    <div id="player-lottery-anim"></div>
  </div>

  <div id="player-results-panel" class="results-panel" hidden>
    <h3>選手ドラフト結果</h3>
    <div id="player-results-grid"></div>
  </div>

  <button id="player-reset-btn" class="btn btn-link">選手ドラフトを全リセットする（管理者以外は押さないで）</button>
</section>

<hr class="draft-divider">

<section class="draft-block" id="team-draft-block">
  <div class="draft-heading-row">
    <h2 class="draft-heading">チームドラフト</h2>
    <div class="board-side">
      <button id="team-reveal-btn" class="btn btn-primary" disabled>指名結果発表</button>
      <button id="team-lottery-btn" class="btn btn-danger" hidden>抽選を行う</button>
      <button id="team-next-round-btn" class="btn btn-primary" hidden>結果を確定する</button>
    </div>
  </div>
  <div id="team-status-banner" class="status-banner" hidden></div>

  <p class="scroll-hint">← 横にスクロールできます →</p>
  <div class="board-wrap">
    <div class="board-scroll">
      <table id="team-board-table" class="board-table">
        <colgroup>
          <col style="width:160px">
          <col><col><col><col><col>
        </colgroup>
        <thead>
          <tr id="team-board-header-row">
            <th></th>
          </tr>
        </thead>
        <tbody id="team-board-body"></tbody>
      </table>
    </div>
  </div>

  <div id="team-pick-panel" class="pick-panel" hidden>
    <h3>あなたの指名チームを選んでください</h3>
    <select id="team-item-select"></select>
    <button id="team-pick-btn" class="btn btn-primary">指名する</button>
  </div>

  <div id="team-wait-panel" class="wait-panel" hidden>
    <p id="team-wait-message"></p>
  </div>

  <div id="team-lottery-panel" class="lottery-panel" hidden>
    <h3>抽選中...</h3>
    <div id="team-lottery-anim"></div>
  </div>

  <div id="team-results-panel" class="results-panel" hidden>
    <h3>チームドラフト結果</h3>
    <div id="team-results-grid"></div>
  </div>

  <button id="team-reset-btn" class="btn btn-link">チームドラフトを全リセットする（管理者以外は押さないで）</button>
</section>

</main>

<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button id="confirm-yes" class="btn btn-primary">YES</button>
      <button id="confirm-no" class="btn btn-secondary">NO</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=10"></script>
<script src="players_data.js?v=10"></script>
<script src="teams_data.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
